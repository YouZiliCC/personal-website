<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YouZiliCC 的个人网站">
    <title>YouZiliCC - 个人网站</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">YouZiliCC</div>
            <ul class="nav-links">
                <li><a href="#home">主页</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#projects">项目</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主页 -->
    <section id="home" class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>欢迎来到我的个人网站</h1>
                <p>一位充满热情的开发者</p>
                <a href="#projects" class="cta-btn">查看我的作品</a>
            </div>
        </div>
    </section>

    <!-- 关于部分 -->
    <section id="about" class="about">
        <div class="container">
            <h2>关于我</h2>
            <p>我是一名全栈开发者，热爱创意和技术的结合。在这里分享我的项目和想法。</p>
        </div>
    </section>

    <!-- 项目部分 -->
    <section id="projects" class="projects">
        <div class="container">
            <h2>我的项目</h2>
            <div class="projects-grid">
                <div class="project-card">
                    <h3>项目 1</h3>
                    <p>项目描述</p>
                    <a href="#" class="project-link">了解更多</a>
                </div>
                <div class="project-card">
                    <h3>项目 2</h3>
                    <p>项目描述</p>
                    <a href="#" class="project-link">了解更多</a>
                </div>
                <div class="project-card">
                    <h3>项目 3</h3>
                    <p>项目描述</p>
                    <a href="#" class="project-link">了解更多</a>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系部分 -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>联系我</h2>
            <form id="contact-form" class="contact-form">
                <input type="email" placeholder="您的邮箱" required>
                <textarea placeholder="您的信息" rows="5" required></textarea>
                <button type="submit" class="submit-btn">发送</button>
            </form>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <p>&copy; 2026 YouZiliCC. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/main.js"></script>
</body>
</html>
